[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-session-id"
version = "0.1.0"
description = "Hybrid user identification over VPN/Proxy sessions using behavioral biometrics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "joblib>=1.3",
  "python-docx>=1.1",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
